version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: dailyrpg-postgres
    environment:
      POSTGRES_USER: dailyrpg
      POSTGRES_PASSWORD: dailyrpg123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - dailyrpg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyrpg"]
      interval: 5s
      timeout: 5s
      retries: 5

  

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dailyrpg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dailyrpg
      RABBITMQ_DEFAULT_PASS: dailyrpg123
    networks:
      - dailyrpg-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: dailyrpg-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - dailyrpg-network

  # Identity Service
  identity-service:
    build:
      context: ./backend/identity-service
      dockerfile: Dockerfile
    container_name: dailyrpg-identity
    ports:
      - "5048:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dailyrpg_identity;Username=dailyrpg;Password=dailyrpg123
      - Jwt__Key=ThisIsMySuperSecretKeyForDailyRPG2024!@#$%^&*()_+
      - Jwt__Issuer=DailyRPG
      - Jwt__Audience=DailyRPG
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dailyrpg-network

  # Characteristic Service
  characteristic-service:
    build:
      context: ./backend/character-service/characteristic-service
      dockerfile: Dockerfile
    container_name: dailyrpg-characteristic
    ports:
      - "5225:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dailyrpg_character;Username=dailyrpg;Password=dailyrpg123
      - Jwt__Key=ThisIsMySuperSecretKeyForDailyRPG2024!@#$%^&*()_+
      - Jwt__Issuer=DailyRPG
      - Jwt__Audience=DailyRPG
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - dailyrpg-network

networks:
  dailyrpg-network:
    driver: bridge

volumes:
  postgres_data: